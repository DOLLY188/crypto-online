<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b1020;color:white}
header{padding:22px;text-align:center;background:#111936}
h1{margin:0;color:#5ee7ff}header p{color:#9aa7c7}
main{max-width:1100px;margin:auto;padding:22px}
.panel{background:#111936;padding:20px;border-radius:16px;margin-bottom:20px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#151e3d;padding:18px;border-radius:12px}
.stat b{display:block;font-size:21px;margin-top:8px}
form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
input,button{padding:13px;border:0;border-radius:9px}
input{background:#202a49;color:white}
button{background:#5ee7ff;font-weight:bold;cursor:pointer}
.hold{background:#151e3d;padding:17px;border-radius:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.up{color:#42e695}.down{color:#ff637d}
.remove{background:#29365f;color:white}
</style>
</head>

<body>

<header>
<h1>₿ Crypto Online</h1>
<p>Crypto market & portfolio dashboard</p>
</header>

<main>

<div class="panel">
<h2>💼 My Portfolio</h2>

<div class="summary">
<div class="stat">Total Value<b id="total">$0.00</b></div>
<div class="stat">Invested<b id="invested">$0.00</b></div>
<div class="stat">Profit / Loss<b id="profit">$0.00</b></div>
</div>
</div>

<div class="panel">
<h2>➕ Add Holding</h2>

<form onsubmit="addHolding(event)">
<input id="coin" placeholder="bitcoin" required>
<input id="amount" type="number" step="any" placeholder="Amount owned" required>
<button>Add</button>
</form>
</div>

<div class="panel">
<h2>📊 Holdings</h2>
<div id="holdings">No holdings yet.</div>
</div>

</main>

<script>
let holdings=JSON.parse(localStorage.getItem("portfolio")||"[]");

async function load(){
let total=0,invest=0;
let box=document.getElementById("holdings");
box.innerHTML="";

for(let [i,h] of holdings.entries()){
try{
let r=await fetch(
`https://api.coingecko.com/api/v3/simple/price?ids=${h.coin}&vs_currencies=usd`
);
let d=await r.json();
let price=d[h.coin]?.usd;

if(!price)continue;

let value=price*h.amount;
total+=value;
invest+=h.cost||0;

box.innerHTML+=`
<div class="hold">
<div class="row">
<strong>🪙 ${h.coin.toUpperCase()}</strong>
<span>${h.amount} coins</span>
</div>
<div class="row">
<span>Price: $${price.toLocaleString()}</span>
<strong>$${value.toLocaleString()}</strong>
</div>
<button class="remove" onclick="removeHolding(${i})">Remove</button>
</div>`;
}catch(e){}
}

document.getElementById("total").textContent=
"$"+total.toLocaleString(undefined,{minimumFractionDigits:2});

document.getElementById("invested").textContent=
"$"+invest.toLocaleString(undefined,{minimumFractionDigits:2});

let p=total-invest;
let el=document.getElementById("profit");
el.textContent=(p>=0?"+$":"-$")+Math.abs(p).toLocaleString(undefined,{minimumFractionDigits:2});
el.className=p>=0?"up":"down";
}

function addHolding(e){
e.preventDefault();

let coin=document.getElementById("coin").value.trim().toLowerCase();
let amount=Number(document.getElementById("amount").value);

holdings.push({coin,amount,cost:0});
localStorage.setItem("portfolio",JSON.stringify(holdings));

e.target.reset();
load();
}

function removeHolding(i){
holdings.splice(i,1);
localStorage.setItem("portfolio",JSON.stringify(holdings));
load();
}

load();
setInterval(load,60000);
</script>

</body>
</html>
